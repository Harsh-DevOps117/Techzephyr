name: techzephyr4

services:
  postgres:
    image: postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_DB: techzephyr
      POSTGRES_USER: techzephyr
      POSTGRES_PASSWORD: techzephyr_dev_only
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techzephyr -d techzephyr"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  rabbitmq:
    image: rabbitmq:latest
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: techzephyr
      RABBITMQ_DEFAULT_PASS: techzephyr_dev_only
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  redis:
    image: redis:latest
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
    image: techzephyr4-api:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://techzephyr:techzephyr_dev_only@postgres:5432/techzephyr
      RABBITMQ_URL: amqp://techzephyr:techzephyr_dev_only@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      ALLOWED_ORIGIN: http://localhost:3001,http://localhost:8080
      DATA_ROOT: /app/data
      VALIDATOR_PATH: /app/validator.py
      PYTHON_BIN: python3
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TEAM_NAME: ${TEAM_NAME:-TechZephyr}
      ALLOW_HEADER_AUTH: ${ALLOW_HEADER_AUTH:-false}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "node dist/infrastructure/database/migrate.js && node dist/interfaces/http/server.js"]

  worker:
    image: techzephyr4-api:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://techzephyr:techzephyr_dev_only@postgres:5432/techzephyr
      RABBITMQ_URL: amqp://techzephyr:techzephyr_dev_only@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      DATA_ROOT: /app/data
      VALIDATOR_PATH: /app/validator.py
      PYTHON_BIN: python3
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TEAM_NAME: ${TEAM_NAME:-TechZephyr}
    depends_on:
      api:
        condition: service_started
    command: ["node", "dist/interfaces/workers/worker.js"]

  swagger-ui:
    image: swaggerapi/swagger-ui:latest
    restart: unless-stopped
    environment:
      SWAGGER_JSON: /tmp/openapi.yaml
    ports:
      - "8080:8080"
    volumes:
      - ./docs/openapi.yaml:/tmp/openapi.yaml:ro,Z
    depends_on:
      api:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        API_INTERNAL_URL: http://api:3000
    image: techzephyr4-frontend:latest
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:3000
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
