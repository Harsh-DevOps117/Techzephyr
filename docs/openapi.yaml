openapi: 3.1.0
info:
  title: TechZephyr 4 API
  version: 0.1.0
  description: CIT scheduling API. All writes require a UUIDv7 Idempotency-Key and an authenticated actor header.
servers:
  - url: http://localhost:3000
security:
  - BearerAuth: []
tags:
  - name: Auth
  - name: Datasets
  - name: Schedules
  - name: Bookings
  - name: AI
  - name: Jobs
paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Sign in and obtain an access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: admin@cit.local }
                password: { type: string, format: password, example: TechZephyr!2026 }
      responses:
        '200':
          description: Access and refresh tokens
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  refreshToken: { type: string }
                  expiresIn: { type: integer, example: 900 }
                  role: { type: string, example: admin }
        '401': { description: Invalid credentials }
  /health:
    get:
      security: []
      summary: Service and database health check
      responses:
        '200': { description: Healthy }
  /api/v1/datasets/import:
    post:
      tags: [Datasets]
      summary: Import an immutable CIT dataset version
      parameters: [ { $ref: '#/components/parameters/ActorId' }, { $ref: '#/components/parameters/ActorRole' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dataset, sourceName]
              properties:
                sourceName: { type: string }
                dataset: { type: object, additionalProperties: true }
      responses:
        '201': { description: Imported dataset version }
        '409': { $ref: '#/components/responses/IdempotencyConflict' }
  /api/v1/schedules/generate:
    post:
      tags: [Schedules]
      summary: Queue initial timetable generation
      parameters: [ { $ref: '#/components/parameters/ActorId' }, { $ref: '#/components/parameters/ActorRole' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [datasetVersionId], properties: { datasetVersionId: { type: string, format: uuid } } }
      responses: { '202': { description: Generation job queued } }
  /api/v1/schedules/repair:
    post:
      tags: [Schedules]
      summary: Queue a minimum-change schedule repair
      parameters: [ { $ref: '#/components/parameters/ActorId' }, { $ref: '#/components/parameters/ActorRole' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baselineScheduleId, datasetVersionId, disruption]
              properties:
                baselineScheduleId: { type: string, format: uuid }
                datasetVersionId: { type: string, format: uuid }
                disruption: { type: object, required: [changes] }
      responses: { '202': { description: Repair job queued } }
  /api/v1/bookings/decide:
    post:
      tags: [Bookings]
      summary: Queue priority-aware Spectra booking decisions
      parameters: [ { $ref: '#/components/parameters/ActorId' }, { $ref: '#/components/parameters/ActorRole' }, { $ref: '#/components/parameters/IdempotencyKey' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [scheduleVersionId], properties: { scheduleVersionId: { type: string, format: uuid } } }
      responses: { '202': { description: Booking job queued } }
  /api/v1/schedules/{id}/approve:
    post:
      tags: [Schedules]
      summary: Approve a validated schedule proposal
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/ActorRole'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: Approved }
        '403': { description: Self approval is forbidden }
        '409': { description: Proposal is not validated }
  /api/v1/ai/booking-drafts:
    post:
      tags: [AI]
      summary: Turn an English or Hinglish request into an editable booking draft
      description: The AI output is schema-validated but is not a booking decision. Submit its edited result through the normal booking workflow.
      parameters: [ { $ref: '#/components/parameters/ActorId' }, { $ref: '#/components/parameters/ActorRole' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 3, maxLength: 4000 }
      responses:
        '200':
          description: Schema-validated draft. It must still be checked by deterministic booking validation before submission.
          content:
            application/json:
              schema:
                type: object
                required: [draft, validation, requestId]
        '503': { description: AI provider is unavailable; use the manual form. }
  /api/v1/ai/schedule-change-drafts:
    post:
      tags: [AI]
      summary: Turn a faculty schedule-change prompt into an editable disruption draft
      responses: { '200': { description: Schema-validated draft that still requires deterministic repair and approval }, '503': { description: AI unavailable; upload the manual change format } }
  /api/v1/jobs/{id}:
    get:
      tags: [Jobs]
      summary: Read asynchronous job status
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/ActorRole'
      responses: { '200': { description: Job details } }
  /api/v1/booking-requests:
    get:
      tags: [Bookings]
      summary: List submitted natural-language venue requests
      responses: { '200': { description: Requests visible to the current role } }
    post:
      tags: [Bookings]
      summary: Submit an edited AI or manual draft for deterministic evaluation
      responses: { '201': { description: Pending review with an approved, rejected or alternative proposal } }
  /api/v1/booking-requests/{id}/review:
    post:
      tags: [Bookings]
      summary: Apply a deterministic venue decision after authorized review
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { description: Reviewed decision applied }, '403': { description: Self-review forbidden } }
  /api/v1/booking-requests/{id}/cancel:
    post:
      tags: [Bookings]
      summary: Cancel a request as its requester or an Admin
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { description: Request cancelled with an explanatory decision }, '403': { description: Not the requester } }
  /api/v1/dashboard:
    get:
      tags: [Schedules]
      summary: Read current campus scheduling metrics
      responses: { '200': { description: Dataset, schedule, approval and queue metrics } }
  /api/v1/datasets:
    get:
      tags: [Datasets]
      summary: List imported immutable dataset versions
      responses: { '200': { description: Dataset versions } }
  /api/v1/schedules:
    get:
      tags: [Schedules]
      summary: List generated and repaired schedule versions
      responses: { '200': { description: Schedule versions and validation summaries } }
  /api/v1/approvals:
    get:
      tags: [Schedules]
      summary: List zero-conflict proposals awaiting Admin approval
      responses: { '200': { description: Pending approval queue } }
  /api/v1/schedules/{id}:
    get:
      tags: [Schedules]
      summary: Read a schedule, validation report and generated export
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { description: Schedule detail }, '404': { description: Not found } }
  /api/v1/schedules/{id}/export:
    get:
      tags: [Schedules]
      summary: Download schedule.json for a completed version
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { '200': { description: Official schedule export }, '409': { description: Export not ready } }
  /api/v1/schedules/{id}/timetable:
    get:
      tags: [Schedules]
      summary: View a timetable filtered by group, faculty or room
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: group, in: query, schema: { type: string } }
        - { name: faculty, in: query, schema: { type: string } }
        - { name: room, in: query, schema: { type: string } }
      responses: { '200': { description: Readable timetable entries } }
  /api/v1/schedules/{id}/explanations/{sessionId}:
    get:
      tags: [Schedules]
      summary: Explain a deterministic session placement
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: sessionId, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: Placement reasons and matched constraints } }
  /api/v1/manual-events:
    post:
      tags: [Bookings]
      summary: Validate and schedule an authorized manual event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scheduleVersionId, title, day, startPeriod, endPeriod, roomId, attendance, reason]
              properties:
                scheduleVersionId: { type: string, format: uuid }
                title: { type: string }
                day: { type: string, enum: [MON, TUE, WED, THU, FRI] }
                startPeriod: { type: integer, minimum: 1, maximum: 13 }
                endPeriod: { type: integer, minimum: 1, maximum: 13 }
                roomId: { type: string }
                attendance: { type: integer, minimum: 1 }
                needs: { type: array, items: { type: string } }
                mandatoryGroups: { type: array, items: { type: string } }
                reason: { type: string }
      responses: { '201': { description: Event passed hard constraints }, '409': { description: Event conflicts or room is unsuitable } }
  /api/v1/demo/reset:
    post:
      tags: [Datasets]
      summary: Reset generated demo datasets, schedules, jobs and decisions
      responses: { '200': { description: Demo data reset } }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Call `/api/v1/auth/login`, copy `accessToken`, then click Authorize and paste it here.
    UserId:
      type: apiKey
      in: header
      name: x-user-id
      description: Use local demo Admin ID `018f9f69-f6f2-7b01-8a2b-531e5d44e018`.
    UserRole:
      type: apiKey
      in: header
      name: x-user-role
      description: Use `admin` for the local Admin demo user.
  parameters:
    ActorId: { name: x-user-id, in: header, required: true, schema: { type: string, format: uuid }, example: 018f9f69-f6f2-7b01-8a2b-531e5d44e018, description: Development authentication actor ID }
    ActorRole: { name: x-user-role, in: header, required: true, schema: { type: string, enum: [admin, department_coordinator, faculty, club] }, example: admin }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, format: uuid }, description: A UUIDv7 generated once per user intent }
  responses:
    IdempotencyConflict:
      description: The idempotency key has already been used with a different request body.
