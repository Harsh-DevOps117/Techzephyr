name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main, cursor/deploy-cicd-2111]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Connect and deploy
        env:
          PEM: ${{ secrets.PEM }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          KEY: ${{ secrets.KEY }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          HOST_IP: ${{ secrets.HOST_IP }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          IP: ${{ secrets.IP }}
          HOST: ${{ secrets.HOST }}
          HOSTIP: ${{ secrets.HOSTIP }}
          IP_ADDRESS: ${{ secrets.IP_ADDRESS }}
          PUBLIC_IP: ${{ secrets.PUBLIC_IP }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_IP: ${{ secrets.EC2_IP }}
          EC2_PUBLIC_IP: ${{ secrets.EC2_PUBLIC_IP }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_IP: ${{ secrets.DEPLOY_IP }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_IP: ${{ secrets.REMOTE_IP }}
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          HOST_NAME: ${{ secrets.HOST_NAME }}
          NAME: ${{ secrets.NAME }}
          SSH_USER: ${{ secrets.SSH_USER }}
          USERNAME: ${{ secrets.USERNAME }}
          USER_NAME: ${{ secrets.USER_NAME }}
          SERVER_NAME: ${{ secrets.SERVER_NAME }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          HOSTNAME: ${{ secrets.HOSTNAME }}
          EC2_USER: ${{ secrets.EC2_USER }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          HOST_USER: ${{ secrets.HOST_USER }}
          LOGIN_USER: ${{ secrets.LOGIN_USER }}
        run: |
          set -euo pipefail
          pick() {
            local value="" chosen="" var
            for var in "$@"; do
              if [ -n "${!var:-}" ]; then
                echo "secret ${var} is set" >&2
                if [ -z "$value" ]; then
                  value="${!var}"
                  chosen="$var"
                fi
              fi
            done
            if [ -z "$value" ]; then
              echo "none of these secrets are set: $*" >&2
              return 1
            fi
            echo "selected ${chosen}" >&2
            printf '%s' "$value"
          }
          key="$(pick PEM SSH_PRIVATE_KEY SSH_KEY PRIVATE_KEY KEY DEPLOY_KEY)"
          ip="$(pick HOST_IP SERVER_IP IP HOST HOSTIP IP_ADDRESS PUBLIC_IP SERVER_HOST SSH_HOST EC2_HOST EC2_IP EC2_PUBLIC_IP DEPLOY_HOST DEPLOY_IP REMOTE_HOST REMOTE_IP VPS_IP VPS_HOST)"
          name="$(pick HOST_NAME NAME SSH_USER USERNAME USER_NAME SERVER_NAME SERVER_USER HOSTNAME EC2_USER SSH_USERNAME DEPLOY_USER HOST_USER LOGIN_USER || true)"
          user="${name:-ubuntu}"
          if [[ "$user" == *.* ]]; then
            user="${SSH_USER:-${EC2_USER:-${DEPLOY_USER:-ubuntu}}}"
            echo "Name looks like a hostname. SSH user is ${user}."
          else
            echo "SSH user is ${user}."
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$key" | sed 's/\\n/\n/g' > ~/.ssh/deploy.pem
          if ! grep -q "BEGIN .*PRIVATE KEY" ~/.ssh/deploy.pem; then
            base64 -d ~/.ssh/deploy.pem > ~/.ssh/deploy.pem.decoded
            mv ~/.ssh/deploy.pem.decoded ~/.ssh/deploy.pem
          fi
          chmod 600 ~/.ssh/deploy.pem
          ssh -i ~/.ssh/deploy.pem \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 \
            "${user}@${ip}" \
            "PUBLIC_ORIGIN=http://${ip} bash -s" <<'REMOTE'
          set -euo pipefail
          if ! command -v git >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y git ca-certificates curl
          fi
          if ! command -v docker >/dev/null 2>&1; then
            curl -fsSL https://get.docker.com | sudo sh
            sudo usermod -aG docker "$USER" || true
          fi
          docker_cmd() {
            if docker info >/dev/null 2>&1; then
              docker "$@"
            else
              sudo docker "$@"
            fi
          }
          app=/opt/techzephyr
          if [ ! -d "$app/.git" ]; then
            sudo mkdir -p /opt
            sudo chown "$USER:$USER" /opt
            git clone https://github.com/Harsh-DevOps117/Techzephyr.git "$app"
          fi
          cd "$app"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          if [ ! -f .env ]; then
            cp .env.example .env
            python3 - "$PUBLIC_ORIGIN" <<'PY'
          import pathlib, secrets, sys
          origin = sys.argv[1]
          path = pathlib.Path(".env")
          lines = []
          for line in path.read_text().splitlines():
              if line.startswith("JWT_SECRET="):
                  lines.append("JWT_SECRET=" + secrets.token_urlsafe(48))
              elif line.startswith("NODE_ENV="):
                  lines.append("NODE_ENV=production")
              elif line.startswith("ALLOWED_ORIGIN="):
                  lines.append(f"ALLOWED_ORIGIN={origin},http://localhost")
              else:
                  lines.append(line)
          path.write_text("\n".join(lines) + "\n")
          PY
          fi
          docker_cmd compose up -d --build
          docker_cmd compose ps
          curl -fsS http://127.0.0.1/healthz
          echo
          curl -fsS http://127.0.0.1/health
          echo
          REMOTE
