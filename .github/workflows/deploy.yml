name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main, cursor/deploy-cicd-2111]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Connect and deploy
        env:
          PEM: ${{ secrets.PEM }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          KEY: ${{ secrets.KEY }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          HOST_IP: ${{ secrets.HOST_IP }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          IP: ${{ secrets.IP }}
          HOST: ${{ secrets.HOST }}
          HOSTIP: ${{ secrets.HOSTIP }}
          IP_ADDRESS: ${{ secrets.IP_ADDRESS }}
          PUBLIC_IP: ${{ secrets.PUBLIC_IP }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_IP: ${{ secrets.EC2_IP }}
          EC2_PUBLIC_IP: ${{ secrets.EC2_PUBLIC_IP }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_IP: ${{ secrets.DEPLOY_IP }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_IP: ${{ secrets.REMOTE_IP }}
          VPS_IP: ${{ secrets.VPS_IP }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          HOST_NAME: ${{ secrets.HOST_NAME }}
          NAME: ${{ secrets.NAME }}
          SSH_USER: ${{ secrets.SSH_USER }}
          USERNAME: ${{ secrets.USERNAME }}
          USER_NAME: ${{ secrets.USER_NAME }}
          SERVER_NAME: ${{ secrets.SERVER_NAME }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          HOSTNAME: ${{ secrets.HOSTNAME }}
          EC2_USER: ${{ secrets.EC2_USER }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          HOST_USER: ${{ secrets.HOST_USER }}
          LOGIN_USER: ${{ secrets.LOGIN_USER }}
        run: |
          set -euo pipefail
          pick() {
            local value="" chosen="" var
            for var in "$@"; do
              if [ -n "${!var:-}" ]; then
                echo "secret ${var} is set" >&2
                if [ -z "$value" ]; then
                  value="${!var}"
                  chosen="$var"
                fi
              fi
            done
            if [ -z "$value" ]; then
              echo "none of these secrets are set: $*" >&2
              return 1
            fi
            echo "selected ${chosen}" >&2
            printf '%s' "$value"
          }
          key="$(pick PEM SSH_PRIVATE_KEY SSH_KEY PRIVATE_KEY KEY DEPLOY_KEY)"
          ip="$(pick HOST_IP SERVER_IP IP HOST HOSTIP IP_ADDRESS PUBLIC_IP SERVER_HOST SSH_HOST EC2_HOST EC2_IP EC2_PUBLIC_IP DEPLOY_HOST DEPLOY_IP REMOTE_HOST REMOTE_IP VPS_IP VPS_HOST)"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$key" | sed 's/\\n/\n/g' | tr -d '\r' > ~/.ssh/deploy.pem
          if ! grep -q "BEGIN .*PRIVATE KEY" ~/.ssh/deploy.pem; then
            base64 -d ~/.ssh/deploy.pem > ~/.ssh/deploy.pem.decoded || true
            if [ -s ~/.ssh/deploy.pem.decoded ]; then
              mv ~/.ssh/deploy.pem.decoded ~/.ssh/deploy.pem
            fi
          fi
          chmod 600 ~/.ssh/deploy.pem
          if ! ssh-keygen -y -f ~/.ssh/deploy.pem >/dev/null; then
            echo "The private key secret is not a readable SSH private key."
            exit 1
          fi
          echo "Private key parsed."
          candidates=()
          add_user() {
            local candidate="$1"
            [ -n "$candidate" ] || return 0
            [[ "$candidate" == *.* ]] && return 0
            if [ "${#candidates[@]}" -gt 0 ]; then
              local existing
              for existing in "${candidates[@]}"; do
                [ "$existing" = "$candidate" ] && return 0
              done
            fi
            candidates+=("$candidate")
          }
          add_user "${SSH_USERNAME:-}"
          add_user "${SSH_USER:-}"
          add_user "${EC2_USER:-}"
          add_user "${SERVER_USER:-}"
          add_user "${DEPLOY_USER:-}"
          add_user "${HOST_USER:-}"
          add_user "${LOGIN_USER:-}"
          add_user "${USERNAME:-}"
          add_user "${USER_NAME:-}"
          add_user "${HOST_NAME:-}"
          add_user "${NAME:-}"
          add_user ubuntu
          add_user ec2-user
          add_user admin
          cat > /tmp/remote-deploy.sh <<'REMOTE'
          set -euo pipefail
          install_pkgs() {
            if command -v apt-get >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y "$@"
            elif command -v dnf >/dev/null 2>&1; then
              sudo dnf install -y "$@"
            elif command -v yum >/dev/null 2>&1; then
              sudo yum install -y "$@"
            elif command -v apk >/dev/null 2>&1; then
              sudo apk add --no-cache "$@"
            else
              echo "No supported package manager. Install git, curl, and python3, then rerun."
              exit 1
            fi
          }
          if ! command -v git >/dev/null 2>&1 || ! command -v curl >/dev/null 2>&1 || ! command -v python3 >/dev/null 2>&1; then
            install_pkgs git ca-certificates curl python3
          fi
          if ! command -v docker >/dev/null 2>&1; then
            curl -fsSL https://get.docker.com | sudo sh
            sudo usermod -aG docker "$USER" || true
          fi
          docker_cmd() {
            if docker info >/dev/null 2>&1; then
              docker "$@"
            else
              sudo docker "$@"
            fi
          }
          app=/opt/techzephyr
          if [ ! -d "$app/.git" ]; then
            sudo mkdir -p /opt
            sudo chown "$USER:$USER" /opt
            git clone https://github.com/Harsh-DevOps117/Techzephyr.git "$app"
          fi
          cd "$app"
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          if [ ! -f .env ]; then
            cp .env.example .env
            python3 - "$PUBLIC_ORIGIN" <<'PY'
          import pathlib, secrets, sys
          origin = sys.argv[1]
          path = pathlib.Path(".env")
          lines = []
          for line in path.read_text().splitlines():
              if line.startswith("JWT_SECRET="):
                  lines.append("JWT_SECRET=" + secrets.token_urlsafe(48))
              elif line.startswith("NODE_ENV="):
                  lines.append("NODE_ENV=production")
              elif line.startswith("ALLOWED_ORIGIN="):
                  lines.append(f"ALLOWED_ORIGIN={origin},http://localhost")
              else:
                  lines.append(line)
          path.write_text("\n".join(lines) + "\n")
          PY
          fi
          docker_cmd compose up -d --build
          docker_cmd compose ps
          curl -fsS http://127.0.0.1/healthz
          echo
          curl -fsS http://127.0.0.1/health
          echo
          REMOTE
          auth_user=""
          for user in "${candidates[@]}"; do
            if ssh -i ~/.ssh/deploy.pem \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=accept-new \
              -o PreferredAuthentications=publickey \
              -o ConnectTimeout=15 \
              "${user}@${ip}" true; then
              auth_user="$user"
              echo "SSH key accepted."
              break
            fi
          done
          if [ -z "$auth_user" ]; then
            echo "The server rejected the key for every SSH user candidate. Install this public key in that user's authorized_keys."
            exit 1
          fi
          ssh -i ~/.ssh/deploy.pem \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 \
            "${auth_user}@${ip}" \
            "PUBLIC_ORIGIN=http://${ip} bash -s" < /tmp/remote-deploy.sh
